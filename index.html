<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <meta name="description" content="和小兔一起练习 1～9 的乘法口诀。">
  <title>小兔乘法岛 · 九九乘法练习</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">🐰</span><span>小兔乘法岛</span></div><span class="tag">✦ 1～9 乘法练习</span></header>
    <main class="card">
      <section class="screen home" id="home-screen" aria-labelledby="home-title">
        <div class="intro">
          <div><span class="eyebrow">✦ 每天进步一点点</span><h1 id="home-title">和小兔一起<br><span>玩转乘法！</span></h1><p>从 1 到 9，练习乘法口诀。<br>不着急，慢慢想，你一定可以！</p></div>
          <svg class="art" viewBox="0 0 180 180" role="img" aria-label="抱着胡萝卜的小兔子">
            <circle cx="90" cy="92" r="76" fill="#fff0e8"/>
            <ellipse cx="65" cy="53" rx="14" ry="40" transform="rotate(-14 65 53)" fill="#fffefd" stroke="#d9bdb1" stroke-width="3"/>
            <ellipse cx="112" cy="52" rx="14" ry="40" transform="rotate(12 112 52)" fill="#fffefd" stroke="#d9bdb1" stroke-width="3"/>
            <ellipse cx="65" cy="50" rx="5" ry="24" transform="rotate(-14 65 50)" fill="#f8c7c3"/>
            <ellipse cx="112" cy="49" rx="5" ry="24" transform="rotate(12 112 49)" fill="#f8c7c3"/>
            <ellipse cx="90" cy="107" rx="53" ry="48" fill="#fffefd" stroke="#d9bdb1" stroke-width="3"/>
            <circle cx="73" cy="102" r="3.5" fill="#66514d"/><circle cx="107" cy="102" r="3.5" fill="#66514d"/>
            <ellipse cx="60" cy="114" rx="8" ry="5" fill="#ffd8d4"/><ellipse cx="120" cy="114" rx="8" ry="5" fill="#ffd8d4"/>
            <path d="M86 111 Q90 115 94 111 M90 114 Q90 121 83 120 M90 114 Q90 121 97 120" fill="none" stroke="#a97870" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M118 128 Q135 111 147 121 Q147 140 127 151 Q119 140 118 128Z" fill="#f7aa74" stroke="#e6976d" stroke-width="2"/>
            <path d="M144 120 Q147 109 156 109 M144 120 Q138 109 134 109" fill="none" stroke="#8dbd91" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="114" cy="135" rx="13" ry="9" transform="rotate(18 114 135)" fill="#fffefd" stroke="#d9bdb1" stroke-width="2.5"/>
          </svg>
        </div>
        <div class="section-title"><span>选一选，要练几题？</span><small>每题都是 1～9 的乘法</small></div>
        <div class="choices" aria-label="选择练习题数">
          <button class="choice" type="button" data-count="10" aria-pressed="false">10 题<span>轻松热身</span></button>
          <button class="choice" type="button" data-count="15" aria-pressed="true">15 题<span>元气练习</span></button>
          <button class="choice" type="button" data-count="20" aria-pressed="false">20 题<span>挑战自己</span></button>
        </div>
        <button class="primary start" id="start-button" type="button">开始练习 →</button><p class="footnote">没有时间限制，做错了也没关系 ♡</p>
      </section>
      <section class="screen quiz" id="quiz-screen" aria-label="乘法练习" hidden>
        <div class="quiz-head"><button class="quiet" id="exit-button" type="button">← 结束练习</button><span class="counter" id="counter"></span></div>
        <div class="progress" role="progressbar" aria-label="练习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="play-area">
          <p class="prompt">小兔出题啦，答案是多少？</p>
          <div class="equation"><span id="factor-one"></span><span class="operator">×</span><span id="factor-two"></span><span class="operator">=</span><input class="answer" id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="输入乘法答案"></div>
          <p class="feedback" id="feedback" aria-live="polite">输入答案，再按检查</p><button class="hint-button" id="hint-button" type="button">💡 想看小提示</button><p class="hint" id="hint" aria-live="polite"></p>
          <div class="keypad" aria-label="数字键盘">
            <button class="key" data-key="7" type="button">7</button><button class="key" data-key="8" type="button">8</button><button class="key" data-key="9" type="button">9</button>
            <button class="key" data-key="4" type="button">4</button><button class="key" data-key="5" type="button">5</button><button class="key" data-key="6" type="button">6</button>
            <button class="key" data-key="1" type="button">1</button><button class="key" data-key="2" type="button">2</button><button class="key" data-key="3" type="button">3</button>
            <button class="key action" data-key="back" type="button" aria-label="删除最后一位">⌫</button><button class="key" data-key="0" type="button">0</button><button class="key action" data-key="clear" type="button">清除</button>
          </div>
          <button class="primary check" id="check-button" type="button" disabled>检查答案 ✓</button>
        </div>
      </section>
      <section class="screen result" id="result-screen" aria-labelledby="result-title" hidden>
        <div class="result-icon" aria-hidden="true">🏆</div><h2 id="result-title">太棒啦，练习完成！</h2><p id="result-message"></p>
        <div class="score"><div class="score-box">完成题数<strong id="finished-count"></strong></div><div class="score-box">一次答对<strong id="first-try-count"></strong></div></div>
        <div class="result-actions"><button class="quiet" id="home-button" type="button">更改题数</button><button class="primary" id="again-button" type="button">再练一轮 →</button></div>
      </section>
    </main>
    <p class="notice">小兔陪你一起成长 · 每次练习都算数 ✨</p>
  </div>
</body>
</html>
